<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  #banchan-root {

    --panel: #FBFAF3;
    --ink: #2B2A22;
    --ink-soft: #6B6858;
    --jade: #4F6D5C;

  .bc-empty-state {

<body>

<div id="banchan-root">
  <div class="bc-header">
    <h1 class="bc-title">오늘의 찬장</h1>
    <div class="bc-date" id="bc-today-label"></div>
  </div>

  <div class="bc-section-label">배달 온 반찬 등록</div>
  <div class="bc-form">
    <div class="bc-field">
      <label>반찬 이름</label>
      <input id="bc-input-name" type="text" placeholder="예: 멸치볶음" />
    </div>
    <div class="bc-field">
      <label>끼분</label>
      <input id="bc-input-servings" type="number" min="1" value="1" />
    </div>
    <div class="bc-field">
      <label>보관 가능일</label>
      <input id="bc-input-shelf" type="number" min="1" value="7" />
    </div>
    <div class="bc-field">
      <label>보관</label>
      <select id="bc-input-storage">
        <option value="fridge">냉장</option>
        <option value="frozen">냉동</option>
      </select>
    </div>
    <button class="bc-add-btn" id="bc-add-btn">등록</button>
  </div>

  <div class="bc-plan-header">
    <div class="bc-section-label" style="margin:0;">이번 주 식단 계획</div>
    <div class="bc-plan-actions">
      <input type="time" id="bc-notify-time" value="11:00" />
      <button class="bc-regen-btn" id="bc-ics-btn">📅 알림으로 받기</button>
      <button class="bc-regen-btn" id="bc-regen-btn">자동으로 다시 짜기</button>
    </div>
  </div>
  <div class="bc-week" id="bc-week"></div>
  <div class="bc-ics-hint">"알림으로 받기"를 누르면 캘린더 파일(.ics)이 다운로드돼요. 그 파일을 열면 폰 캘린더 앱에 이번 주 식단이 일정으로 등록되고, 지정한 시각에 캘린더 알림이 옵니다.</div>

  <div class="bc-section-label">냉장고 속 반찬</div>
  <div class="bc-warning" id="bc-warning" style="display:none;"></div>
  <div class="bc-inventory" id="bc-inventory"></div>
</div>

<script>
// PWA 필수 조건인 인라인 Service Worker 등록
if ('serviceWorker' in navigator) {
  const swCode = `self.addEventListener('fetch', function(e) {});`;
  const swBlob = new Blob([swCode], {type: 'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
}

(function () {
  const STORAGE_KEY = 'banchan-items';
  const WEEKDAY_LABELS = ['일', '월', '화', '수', '목', '금', '토'];
  const MAX_DISHES_PER_DAY = 3;

  let items = [];
  let editingId = null;
  let lastPlan = [];
  let weekPlan = {};

  function todayStart() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function addDays(date, n) {
    const d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }

  function dateKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  }

  function daysBetween(a, b) {
    return Math.round((b - a) / (1000 * 60 * 60 * 24));
  }

  function expiryDate(item) {
    return addDays(new Date(item.deliveredDate), item.shelfLifeDays);
  }

  const hasCloudStorage = typeof window.storage !== 'undefined';
  const PLAN_STORAGE_KEY = 'banchan-week-plan';

  async function loadItems() {
    try {
      if (hasCloudStorage) {
        const result = await window.storage.get(STORAGE_KEY, false);
        items = result && result.value ? JSON.parse(result.value) : [];
      } else {
        const raw = localStorage.getItem(STORAGE_KEY);
        items = raw ? JSON.parse(raw) : [];
      }
    } catch (e) {
      items = [];
    }
  }

  async function saveItems() {
    try {
      if (hasCloudStorage) {
        await window.storage.set(STORAGE_KEY, JSON.stringify(items), false);
      } else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }
    } catch (e) {
      console.error('저장 실패', e);
    }
  }

  async function loadWeekPlan() {
    try {
      if (hasCloudStorage) {
        const result = await window.storage.get(PLAN_STORAGE_KEY, false);
        weekPlan = result && result.value ? JSON.parse(result.value) : {};
      } else {
        const raw = localStorage.getItem(PLAN_STORAGE_KEY);
        weekPlan = raw ? JSON.parse(raw) : {};
      }
    } catch (e) {
      weekPlan = {};
    }
  }

  async function saveWeekPlan() {
    try {
      if (hasCloudStorage) {
        await window.storage.set(PLAN_STORAGE_KEY, JSON.stringify(weekPlan), false);
      } else {
        localStorage.setItem(PLAN_STORAGE_KEY, JSON.stringify(weekPlan));
      }
    } catch (e) {
      console.error('저장 실패', e);
    }
  }

  function renderToday() {
    const t = new Date();
    const label = `${t.getFullYear()}.${String(t.getMonth() + 1).padStart(2, '0')}.${String(t.getDate()).padStart(2, '0')} (${WEEKDAY_LABELS[t.getDay()]})`;
    document.getElementById('bc-today-label').textContent = label;
  }

  function autoAssignPlan() {
    const today = todayStart();
    const pool = items.map(it => ({ ...it, simRemaining: it.servings, expiry: expiryDate(it), jitter: Math.random() }));
    const byKey = {};
    const lastUsed = {};

    const totalServings = pool.reduce((sum, it) => sum + it.servings, 0);
    const baseDishesPerDay = totalServings === 0
      ? 0
      : Math.min(MAX_DISHES_PER_DAY, Math.max(1, Math.round(totalServings / 7)));

    for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
      const day = addDays(today, dayOffset);
      const candidates = pool.filter(it => it.simRemaining > 0 && daysBetween(day, it.expiry) >= 0);

      candidates.sort((a, b) => {
        const expA = daysBetween(day, a.expiry);
        const expB = daysBetween(day, b.expiry);
        const urgentA = expA <= 1 ? 0 : 1;
        const urgentB = expB <= 1 ? 0 : 1;
        if (urgentA !== urgentB) return urgentA - urgentB;
        if (urgentA === 0) return expA - expB;
        return a.jitter - b.jitter;
      });

      const reordered = [...candidates];
      if (dayOffset > 0 && reordered.length > baseDishesPerDay) {
        reordered.sort((a, b) => {
          const aRepeat = lastUsed[a.id] ? 1 : 0;
          const bRepeat = lastUsed[b.id] ? 1 : 0;
          if (aRepeat !== bRepeat) return aRepeat - bRepeat;
          return Math.random() - 0.5;
        });
      }

      const urgentCount = reordered.filter(it => daysBetween(day, it.expiry) <= 1).length;
      const dayLimit = Math.max(baseDishesPerDay, urgentCount);

      const picked = reordered.slice(0, dayLimit);
      picked.forEach(it => {
        const original = pool.find(p => p.id === it.id);
        original.simRemaining -= 1;
      });

      const newLastUsed = {};
      picked.forEach(it => { newLastUsed[it.id] = true; });
      Object.keys(lastUsed).forEach(k => delete lastUsed[k]);
      Object.assign(lastUsed, newLastUsed);

      byKey[dateKey(day)] = picked.map(it => it.id);
    }

    const leftovers = pool.filter(it => it.simRemaining > 0);
    return { byKey, leftovers };
  }

  function resolveDisplayPlan() {
    const today = todayStart();
    const plan = [];

    for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
      const day = addDays(today, dayOffset);
      const key = dateKey(day);
      const ids = weekPlan[key] || [];
      const dishes = ids
        .map(id => items.find(it => it.id === id))
        .filter(Boolean)
        .map(it => ({
          id: it.id,
          name: it.name,
          urgent: daysBetween(day, expiryDate(it)) <= 1,
          frozen: it.storageType === 'frozen',
        }));
      plan.push({ date: day, key, dishes });
    }

    for (let i = 0; i < plan.length - 1; i++) {
      const nextDayFrozenDishes = plan[i + 1].dishes.filter(d => d.frozen).map(d => d.name);
      plan[i].thawReminders = [...new Set(nextDayFrozenDishes)];
    }
    plan[plan.length - 1].thawReminders = [];

    return plan;
  }

  async function regeneratePlan() {
    const { byKey } = autoAssignPlan();
    weekPlan = { ...weekPlan, ...byKey };
    await saveWeekPlan();
    renderWeek();
  }

  function renderWeek() {
    const plan = resolveDisplayPlan();
    lastPlan = plan;
    const container = document.getElementById('bc-week');
    container.innerHTML = '';

    plan.forEach((d, idx) => {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'bc-day' + (idx === 0 ? ' today' : '');
      const label = idx === 0 ? `오늘 · ${WEEKDAY_LABELS[d.date.getDay()]}` : `${d.date.getMonth() + 1}/${d.date.getDate()} · ${WEEKDAY_LABELS[d.date.getDay()]}`;
      const labelDiv = document.createElement('div');
      labelDiv.className = 'bc-day-label';
      labelDiv.textContent = label;
      dayDiv.appendChild(labelDiv);

      if (d.dishes.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'bc-day-empty';
        empty.textContent = '—';
        dayDiv.appendChild(empty);
      } else {
        d.dishes.forEach(dish => {
          const dishDiv = document.createElement('div');
          dishDiv.className = 'bc-dish' + (dish.urgent ? ' urgent' : '');
          dishDiv.innerHTML = `<span>${(dish.frozen ? '🧊 ' : '') + escapeHtml(dish.name)}</span><button class="bc-dish-remove" data-action="remove-dish" data-key="${d.key}" data-item-id="${dish.id}" title="이 날에서 빼기">×</button>`;
          dayDiv.appendChild(dishDiv);
        });
      }

      if (d.thawReminders && d.thawReminders.length > 0) {
        const thawDiv = document.createElement('div');
        thawDiv.className = 'bc-thaw';
        thawDiv.textContent = `❄️→냉장 해동: ${d.thawReminders.join(', ')}`;
        dayDiv.appendChild(thawDiv);
      }

      const assignedIds = d.dishes.map(x => x.id);
      const addableItems = items.filter(it => !assignedIds.includes(it.id));
      if (addableItems.length > 0) {
        const addWrap = document.createElement('div');
        addWrap.className = 'bc-day-add';
        const options = addableItems.map(it => `<option value="${it.id}">${escapeHtml(it.name)}</option>`).join('');
        addWrap.innerHTML = `
          <select class="bc-day-add-select" data-key="${d.key}">
            <option value="">+ 반찬 추가</option>
            ${options}
          </select>
        `;
        dayDiv.appendChild(addWrap);
      }

      container.appendChild(dayDiv);
    });

    const today = todayStart();
    const assignedIdsThisWeek = new Set(plan.flatMap(d => d.dishes.map(x => x.id)));
    const missed = items.filter(it => {
      const daysLeft = daysBetween(today, expiryDate(it));
      return daysLeft >= 0 && daysLeft <= 6 && !assignedIdsThisWeek.has(it.id);
    });

    const warningEl = document.getElementById('bc-warning');
    if (missed.length > 0) {
      warningEl.style.display = 'block';
      warningEl.textContent = `참고: ${missed.map(l => l.name).join(', ')}은(는) 이번 주 안에 유통기한이 끝나는데 아직 계획에 없어요.`;
    } else {
      warningEl.style.display = 'none';
    }
  }

  async function handleWeekClick(e) {
    const removeBtn = e.target.closest('[data-action="remove-dish"]');
    if (removeBtn) {
      const key = removeBtn.dataset.key;
      const itemId = removeBtn.dataset.itemId;
      weekPlan[key] = (weekPlan[key] || []).filter(id => id !== itemId);
      await saveWeekPlan();
      renderWeek();
    }
  }

  async function handleWeekChange(e) {
    const select = e.target.closest('.bc-day-add-select');
    if (select && select.value) {
      const key = select.dataset.key;
      const itemId = select.value;
      weekPlan[key] = weekPlan[key] || [];
      if (!weekPlan[key].includes(itemId)) weekPlan[key].push(itemId);
      await saveWeekPlan();
      renderWeek();
    }
  }

  function expiryStatus(item) {
    const daysLeft = daysBetween(todayStart(), expiryDate(item));
    if (daysLeft <= 1) return { cls: 'urgent', text: daysLeft <= 0 ? '오늘까지' : '내일까지' };
    if (daysLeft <= 2) return { cls: 'soon', text: `${daysLeft}일 남음` };
    return { cls: 'ok', text: `${daysLeft}일 남음` };
  }

  function renderInventory() {
    const container = document.getElementById('bc-inventory');
    container.innerHTML = '';

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'bc-empty-state';
      empty.textContent = '아직 등록된 반찬이 없어요. 위에서 배달 온 반찬을 등록해 보세요.';
      container.appendChild(empty);
      return;
    }

    items
      .slice()
      .sort((a, b) => daysBetween(todayStart(), expiryDate(a)) - daysBetween(todayStart(), expiryDate(b)))
      .forEach(item => {
        const row = document.createElement('div');

        if (editingId === item.id) {
          row.className = 'bc-item bc-item-editing';
          row.innerHTML = `
            <div class="bc-edit-field">
              <label>반찬 이름</label>
              <input type="text" class="bc-edit-name" value="${escapeHtml(item.name)}" />
            </div>
            <div class="bc-edit-field">
              <label>끼분</label>
              <input type="number" min="1" class="bc-edit-servings" value="${item.servings}" />
            </div>
            <div class="bc-edit-field">
              <label>보관 가능일</label>
              <input type="number" min="1" class="bc-edit-shelf" value="${item.shelfLifeDays}" />
            </div>
            <div class="bc-edit-field">
              <label>보관</label>
              <select class="bc-edit-storage">
                <option value="fridge" ${(item.storageType || 'fridge') === 'fridge' ? 'selected' : ''}>냉장</option>
                <option value="frozen" ${item.storageType === 'frozen' ? 'selected' : ''}>냉동</option>
              </select>
            </div>
            <div class="bc-edit-field">
              <label>배달일</label>
              <input type="date" class="bc-edit-date" value="${dateKey(new Date(item.deliveredDate))}" />
            </div>
            <div class="bc-item-actions">
              <button class="bc-mini-btn bc-mini-btn-primary" data-action="save-edit" data-id="${item.id}">저장</button>
              <button class="bc-mini-btn" data-action="cancel-edit" data-id="${item.id}">취소</button>
            </div>
          `;
          container.appendChild(row);
          return;
        }

        const status = expiryStatus(item);
        const isFrozen = item.storageType === 'frozen';
        row.className = 'bc-item';
        row.innerHTML = `
          <div>
            <div class="bc-item-name">${escapeHtml(item.name)} <span class="bc-storage-badge ${isFrozen ? 'frozen' : ''}">${isFrozen ? '냉동' : '냉장'}</span></div>
            <div class="bc-item-meta">배달일 ${formatDate(new Date(item.deliveredDate))}</div>
          </div>
          <div class="bc-item-servings">남은 ${item.servings}끼분</div>
          <div class="bc-item-expiry ${status.cls}">${status.text}</div>
          <div class="bc-item-actions">
            <button class="bc-mini-btn" data-action="edit" data-id="${item.id}">수정</button>
            <button class="bc-mini-btn" data-action="eat" data-id="${item.id}">먹음</button>
            <button class="bc-mini-btn" data-action="delete" data-id="${item.id}">삭제</button>
          </div>
        `;
        container.appendChild(row);
      });
  }

  function formatDate(d) {
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function handleAdd() {
    const nameInput = document.getElementById('bc-input-name');
    const servingsInput = document.getElementById('bc-input-servings');
    const shelfInput = document.getElementById('bc-input-shelf');
    const storageInput = document.getElementById('bc-input-storage');

    const name = nameInput.value.trim();
    const servings = parseInt(servingsInput.value, 10);
    const shelfLifeDays = parseInt(shelfInput.value, 10);
    const storageType = storageInput.value;

    if (!name) { nameInput.focus(); return; }
    if (!servings || servings < 1) { servingsInput.focus(); return; }
    if (!shelfLifeDays || shelfLifeDays < 1) { shelfInput.focus(); return; }

    items.push({
      id: 'item-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      name,
      servings,
      shelfLifeDays,
      storageType,
      deliveredDate: todayStart().toISOString(),
    });

    await saveItems();
    nameInput.value = '';
    servingsInput.value = '1';
    shelfInput.value = '7';
    storageInput.value = 'fridge';
    nameInput.focus();
    renderAll();
  }

  async function handleInventoryClick(e) {
    const btn = e.target.closest('.bc-mini-btn');
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    const item = items.find(it => it.id === id);
    if (!item) return;

    if (action === 'delete') {
      items = items.filter(it => it.id !== id);
      await saveItems();
      renderAll();
    } else if (action === 'eat') {
      item.servings = Math.max(0, item.servings - 1);
      if (item.servings === 0) {
        items = items.filter(it => it.id !== id);
      }
      await saveItems();
      renderAll();
    } else if (action === 'edit') {
      editingId = id;
      renderInventory();
    } else if (action === 'cancel-edit') {
      editingId = null;
      renderInventory();
    } else if (action === 'save-edit') {
      const row = btn.closest('.bc-item');
      const name = row.querySelector('.bc-edit-name').value.trim();
      const servings = parseInt(row.querySelector('.bc-edit-servings').value, 10);
      const shelfLifeDays = parseInt(row.querySelector('.bc-edit-shelf').value, 10);
      const storageType = row.querySelector('.bc-edit-storage').value;
      const dateValue = row.querySelector('.bc-edit-date').value;

      if (!name || !servings || servings < 1 || !shelfLifeDays || shelfLifeDays < 1 || !dateValue) return;

      item.name = name;
      item.servings = servings;
      item.shelfLifeDays = shelfLifeDays;
      item.storageType = storageType;
      item.deliveredDate = new Date(dateValue + 'T00:00:00').toISOString();
      editingId = null;
      await saveItems();
      renderAll();
    }
  }

  function pad2(n) {
    return String(n).padStart(2, '0');
  }

  function icsDateTime(date, hh, mm) {
    return `${date.getFullYear()}${pad2(date.getMonth() + 1)}${pad2(date.getDate())}T${pad2(hh)}${pad2(mm)}00`;
  }

  function icsTimestampNow() {
    const n = new Date();
    return `${n.getUTCFullYear()}${pad2(n.getUTCMonth() + 1)}${pad2(n.getUTCDate())}T${pad2(n.getUTCHours())}${pad2(n.getUTCMinutes())}${pad2(n.getUTCSeconds())}Z`;
  }

  function escapeICS(str) {
    return String(str).replace(/([,;])/g, '\\$1');
  }

  function buildICS(plan, hh, mm) {
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//banchan-planner//KO',
      'CALSCALE:GREGORIAN',
    ];

    plan.forEach((d, idx) => {
      if (d.dishes.length === 0 && (!d.thawReminders || d.thawReminders.length === 0)) return;

      const dishNames = d.dishes.map(x => (x.frozen ? '🧊 ' : '') + x.name).join(', ');
      let description = dishNames || '등록된 반찬이 없어요';
      if (d.thawReminders && d.thawReminders.length > 0) {
        description += `\\n내일 위해 오늘 냉장 해동: ${d.thawReminders.join(', ')}`;
      }

      const start = icsDateTime(d.date, hh, mm);
      const endDate = new Date(d.date);
      const endHH = mm + 30 >= 60 ? hh + 1 : hh;
      const endMM = (mm + 30) % 60;
      const end = icsDateTime(endDate, endHH, endMM);

      lines.push(
        'BEGIN:VEVENT',
        `UID:banchan-${d.date.getTime()}-${idx}@banchan-planner`,
        `DTSTAMP:${icsTimestampNow()}`,
        `DTSTART:${start}`,
        `DTEND:${end}`,
        `SUMMARY:🍚 오늘 반찬: ${escapeICS(dishNames || '없음')}`,
        `DESCRIPTION:${escapeICS(description)}`,
        'BEGIN:VALARM',
        'TRIGGER:-PT0M',
        'ACTION:DISPLAY',
        'DESCRIPTION:오늘의 반찬 알림',
        'END:VALARM',
        'END:VEVENT'
      );
    });

    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }

  function handleICSExport() {
    if (!lastPlan || lastPlan.length === 0) return;
    const timeInput = document.getElementById('bc-notify-time');
    const [hh, mm] = (timeInput.value || '11:00').split(':').map(Number);
    const icsContent = buildICS(lastPlan, hh, mm);

    const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '이번주_반찬식단.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function renderAll() {
    renderInventory();
    renderWeek();
  }

  document.getElementById('bc-add-btn').addEventListener('click', handleAdd);
  document.getElementById('bc-input-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleAdd();
  });
  document.getElementById('bc-regen-btn').addEventListener('click', regeneratePlan);
  document.getElementById('bc-ics-btn').addEventListener('click', handleICSExport);
  document.getElementById('bc-inventory').addEventListener('click', handleInventoryClick);
  document.getElementById('bc-week').addEventListener('click', handleWeekClick);
  document.getElementById('bc-week').addEventListener('change', handleWeekChange);

  renderToday();
  loadItems()
    .then(loadWeekPlan)
    .then(() => {
      const today = todayStart();
      const hasAnyPlanThisWeek = Array.from({ length: 7 }, (_, i) => dateKey(addDays(today, i)))
        .some(k => weekPlan[k] && weekPlan[k].length > 0);
      renderInventory();
      if (!hasAnyPlanThisWeek && items.length > 0) {
        regeneratePlan();
      } else {
        renderWeek();
      }
    });
})();
</script>
</body>
</html>
